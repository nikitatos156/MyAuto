name: Build & Deploy

# При каждом пуше в main:
#  1) APK для Android (Capacitor) → релиз v1.0.<N> (APK + web-zip для обновлений по воздуху).
#     Приложение само проверяет последний релиз через публичный API GitHub и ставит обновления.
#  2) Веб-версия (iPhone, компьютер) → GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
# Секреты (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD — ключ подписи APK
#   UPDATE_TOKEN — необязательно: read-only токен, нужен только если репозиторий приватный

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.v.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Версия и проверка секретов
        id: v
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_TOKEN: ${{ secrets.UPDATE_TOKEN != '' }}
        run: |
          NATIVE=$(tr -d '[:space:]' < native-version.txt)
          RUN=${{ github.run_number }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=1.0.$RUN" >> "$GITHUB_OUTPUT"
          echo "code=$((NATIVE * 100000 + RUN))" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "url=https://$OWNER.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          echo "apk=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_KEY" = "true" ] || echo "::warning::Не заданы ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — собирается только проверочный debug-APK, релиз не создаётся."
          PRIVATE=${{ github.event.repository.private }}
          [ "$PRIVATE" != "true" ] || [ "$HAS_TOKEN" = "true" ] || echo "::warning::Репозиторий приватный, а UPDATE_TOKEN не задан — обновления по воздуху работать не будут."

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Веб-версия (iPhone)
        run: node build.mjs --out dist-web --version "${{ steps.v.outputs.version }}" --native "${{ steps.v.outputs.native }}"

      - name: Веб-часть для Android
        env:
          UPDATE_TOKEN: ${{ github.event.repository.private && secrets.UPDATE_TOKEN || '' }}
        run: node build.mjs --out dist --version "${{ steps.v.outputs.version }}" --native "${{ steps.v.outputs.native }}" --update-repo "${{ github.repository }}"

      - name: Android-проект
        env:
          VERSION_NAME: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Сборка APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAS_KEY: ${{ steps.v.outputs.apk }}
          VERSION: ${{ steps.v.outputs.version }}
          NATIVE: ${{ steps.v.outputs.native }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEY" = "true" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/myauto-release.jks"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            mkdir -p ../out
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "../out/MyAuto-$VERSION.apk"
            (cd ../dist && zip -qr "../out/web-$VERSION.zip" .)
            rm -f "$KEYSTORE_FILE"
          else
            # без ключа — только проверка, что проект собирается (debug-APK не публикуется)
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # Ветки, кроме main (ручной запуск для проверки), только собирают APK — без релиза и сайта
      - name: APK проверочной сборки
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ steps.v.outputs.version }}
          path: |
            out/*.apk
            android/app/build/outputs/apk/*/*.apk
          retention-days: 3

      - name: Релиз
        if: steps.v.outputs.apk == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          NATIVE: ${{ steps.v.outputs.native }}
          MSG: ${{ github.event.head_commit.message }}
          SITE: ${{ steps.v.outputs.url }}
        run: |
          # Первая строка — коротко для приложения, дальше — подробности из коммита и как установить
          MSG="${MSG:-Сборка $VERSION}"
          SHA=$(sha256sum "out/web-$VERSION.zip" | cut -d' ' -f1)
          {
            printf '%s\n\n' "$(printf '%s\n' "$MSG" | head -n 1)"
            printf '%s\n' "$MSG" | tail -n +2 | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' | sed -e '/./,$!d' | awk 'NF { for (; n > 0; n--) print ""; print; next } { n++ }'
            printf '\n### Установка\n'
            printf -- '- **Android** — скачайте `MyAuto-%s.apk` ниже и откройте его. Если приложение уже стоит, оно обновится само.\n' "$VERSION"
            printf -- '- **iPhone и компьютер** — откройте %s (на iPhone — в Safari → «Поделиться» → «На экран Домой»).\n' "$SITE"
            printf '\n<!-- myauto:native=%s sha256=%s -->\n' "$NATIVE" "$SHA"
          } > out/notes.md
          cat out/notes.md
          gh release create "v$VERSION" "out/MyAuto-$VERSION.apk" "out/web-$VERSION.zip" \
            --title "My Auto $VERSION" --notes-file out/notes.md --latest

      - name: Сайт для GitHub Pages
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist-web/version.json';
            const v = JSON.parse(fs.readFileSync(p, 'utf8'));
            v.notes = (process.env.MSG || '').split('\n')[0].slice(0, 140);
            fs.writeFileSync(p, JSON.stringify(v, null, 2));
          "

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist-web

  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Если Pages ещё не включён (Settings → Pages → Source: GitHub Actions), этот шаг не валит всю сборку.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.url }}
    steps:
      - uses: actions/deploy-pages@v5
